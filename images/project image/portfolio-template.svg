<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="pBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04070e"/>
      <stop offset="50%" stop-color="#080e1a"/>
      <stop offset="100%" stop-color="#0c1527"/>
    </linearGradient>
    <linearGradient id="pCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <radialGradient id="sphereGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#04070e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#pBg)"/>

  <!-- Top Navigation -->
  <rect width="800" height="50" fill="#04070e" opacity="0.9"/>
  <circle cx="40" cy="25" r="12" fill="url(#pCyan)"/>
  <text x="65" y="30" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">PORTFOLIA</text>
  <text x="540" y="30" fill="#94a3b8" font-family="sans-serif" font-size="12">About</text>
  <text x="600" y="30" fill="#94a3b8" font-family="sans-serif" font-size="12">Skills</text>
  <text x="660" y="30" fill="#94a3b8" font-family="sans-serif" font-size="12">Projects</text>
  <rect x="715" y="12" width="70" height="26" rx="13" fill="#1e293b"/>
  <text x="750" y="29" fill="#38bdf8" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Hire Me</text>

  <!-- Hero Headline -->
  <text x="60" y="115" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="bold" letter-spacing="2">✦ MODERN ARCHITECTURE</text>
  <text x="60" y="155" fill="#ffffff" font-family="sans-serif" font-size="32" font-weight="900">Crafting Visionary</text>
  <text x="60" y="195" fill="#38bdf8" font-family="sans-serif" font-size="32" font-weight="900">Digital Interfaces.</text>
  
  <text x="60" y="230" fill="#94a3b8" font-family="sans-serif" font-size="13">Modular, responsive, and blazing-fast React portfolio template.</text>

  <rect x="60" y="255" width="130" height="38" rx="19" fill="url(#pCyan)"/>
  <text x="125" y="279" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Explore Works →</text>

  <!-- Right Floating Tech Sphere -->
  <circle cx="620" cy="180" r="110" fill="url(#sphereGlow)"/>
  <circle cx="620" cy="180" r="85" fill="#0b1324" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="620" cy="180" r="65" fill="#111c33" stroke="#0ea5e9" stroke-width="1.5" stroke-dasharray="6 3"/>
  <text x="620" y="175" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">React 18</text>
  <text x="620" y="195" fill="#38bdf8" font-family="sans-serif" font-size="11" text-anchor="middle">MERN & Tailwind</text>

  <!-- Fluid Sculpted White Wave Ribbon across the bottom -->
  <path d="M0,350 C200,320 350,380 500,340 C650,300 730,360 800,330 L800,450 L0,450 Z" fill="#ffffff"/>
  
  <text x="60" y="390" fill="#0f172a" font-family="sans-serif" font-size="16" font-weight="900">The Journey That Shapes Quality.</text>
  <text x="60" y="415" fill="#475569" font-family="sans-serif" font-size="12">12+ Projects Delivered • High Performance • Clean Architecture</text>
  
  <rect x="650" y="375" width="100" height="32" rx="16" fill="#0f172a"/>
  <text x="700" y="396" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">View Live</text>
</svg>
